<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Inventaire</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #1EE8A8;
            font-family: Arial, sans-serif;
        }
        h1 {
            text-align: center; /* Centrer le titre */
            color: #1a1a1a;
        }
        table {
            background-color: #228B22;
            color: white;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        .return-link { display: block; margin: 20px auto; text-align: center; color: #1a1a1a; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Inventaire</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Référence</th>
                <th>Date</th>
                <th>Allée ID</th>
                <th>Emplacement ID</th>
            </tr>
        </thead>
        <tbody>
            {% for item in data %}
            <tr>
                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>
                <td>{{ item[3] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/menu_accueil" class="return-link">Retour à l'accueil</a>
</body>
</html>
