<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Flask Server</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>

    <style>
      /* General page styling */
      body {
        background-color: #8DA14B;
        font-family: Arial, sans-serif;
        color: #1a1a1a;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: flex-start; /* Changed from center */
        align-items: center;
        height: 100vh;
        flex-direction: column;
        text-align: center;

        font-size:20px;
      }

      p{
         font-size: 30px;
      }

      /* Circular title styling */
      h1 {
        display: inline-block;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: linear-gradient(270deg, red, yellow, blue); /* Simplified to three colors */
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        font-weight: bold;
        animation: rotate 55s linear infinite;
        margin-bottom: 20px;
       <!-- align-self: flex-start; /* Aligns the circle to the left */ -->
        margin-left: 20px; /* Optional: Adds some space from the left */
      }

      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Link styling */
      a {
        color: #1a1a1a;
        font-weight: bold;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    {% if produits_arretes %}
    <div role="status" style="box-sizing: border-box; width: 100%; background-color: #228B22; color: white; border-bottom: 2px solid #0F4D0F; padding: 10px 16px; text-align: center; font-weight: bold;">
        {% for produit in produits_arretes %}
        <div>Nous arrêtons la référence {{ produit[0] }} le {{ produit[1]|date_fr }}.</div>
        {% endfor %}
    </div>
    {% endif %}
    <h1>Bienvenue sur la plateforme SCHUTZ</h1>
    <p>Bienvenue <a href={{ url_for('authentification') }}>identifiez vous</a></p>
  </body>
</html>
