<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Gestion de stock</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>

    <style>
      /* General page styling */
      * { box-sizing: border-box; }
      body {
        /* Fond d'écran : l'image du logo, centrée, sur un fond de la même couleur */
        background: #00081c url("{{ url_for('static', filename='fond-accueil.jpg') }}") center / contain no-repeat;
        font-family: Arial, sans-serif;
        color: #ffffff;
        margin: 0;
        padding: 0 16px 8vh;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        min-height: 100vh;
        flex-direction: column;
        text-align: center;
        font-size: 20px;
      }

      p {
        font-size: 30px;
      }

      /* Le titre reste lisible par les lecteurs d'écran, mais n'est plus affiché : le logo le montre déjà */
      h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      /* Link styling */
      a {
        color: #2ee6a6;
        font-weight: bold;
        text-decoration: none;
      }

    </style>
  </head>
  <body>
    <h1>Bienvenue sur Gestion de stock</h1>
    <p>Bienvenue <a href={{ url_for('authentification') }}>identifiez vous</a></p>
  </body>
</html>
