<!DOCTYPE html>
<html lang="fr"> 

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de stock - Authentification</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>  
    <style>
        /* Général pour la page */
        * { box-sizing: border-box; }
        body {
            background-color: #8DA14B;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center; /* Centrage horizontal */
            align-items: center; /* Centrage vertical */
            min-height: 100vh; /* Hauteur de la fenêtre pour centrer */
            font-family: Arial, sans-serif;
        }

        /* Container du formulaire */
        .form-container {
            background-color: #228B22;
            color: white;
            padding: 24px; /* Espace à l'intérieur du container */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Ombre légère */
            width: 100%;
            max-width: 400px;
            height: auto; /* Ajustement de la hauteur selon le contenu */
            text-align: center; /* Centrage du texte */
        }

        /* Style des champs du formulaire */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px; /* Espacement entre les champs */
            background-color: white; /* Fond des champs en blanc */
            border: 1px solid #ccc; /* Bordure légère */
            border-radius: 5px;
            box-sizing: border-box; /* Assure que la largeur inclut padding et bordure */
            font-size: 16px;
        }

        /* Style du bouton de soumission */
        input[type="submit"] {
            background-color: #228B22; /* Couleur verte pour le bouton */
            color: white;
           /* color: whit;  */
            border: 2px solid #0F4D0F;
            padding: 15px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

    </style>
</head>

<body>
    <div class="form-container">
        <h2>Authentification</h2>

        <!-- Formulaire d'authentification -->
        <form action="{{ url_for('authentification') }}" method="POST">
            <input type="text" id="username" name="username" placeholder="Nom d'utilisateur" required>
            <input type="password" id="password" name="password" placeholder="Mot de passe" required>
            <input type="submit" value="Se connecter">
        </form>
    </div>
</body>

</html>
